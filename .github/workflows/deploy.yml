name: Deploy BSC

on:
  push:
    branches:
      - claude/eloquent-lovelace-fde7bn

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Stage VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e

            cd /var/www/bsc

            git fetch origin
            git checkout -B claude/eloquent-lovelace-fde7bn origin/claude/eloquent-lovelace-fde7bn
            git reset --hard origin/claude/eloquent-lovelace-fde7bn

            docker compose build
            docker compose up -d --remove-orphans

            docker image prune -f
