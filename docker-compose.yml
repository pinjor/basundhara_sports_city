# Host ports stay off 80, 3306, and 5432, which are already taken on this machine.
# Web 18480 · API 18481 · Postgres 18432 · Redis 18479
name: basundhara-sports-city

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bsc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bsc_dev_password}
      POSTGRES_DB: bsc
    ports:
      - "18432:5432"
    volumes:
      - bsc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsc -d bsc"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "18479:6379"
    volumes:
      - bsc_redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Local defaults. For a hosted deployment set these in the environment or an .env file
    # (see .env.production.example); NODE_ENV=production refuses the default JWT secret.
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://bsc:${POSTGRES_PASSWORD:-bsc_dev_password}@postgres:5432/bsc?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      PORT: "4000"
      TICKETING_SANDBOX_PAYMENTS: ${TICKETING_SANDBOX_PAYMENTS:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PUBLIC_ASSET_URL: ${PUBLIC_ASSET_URL:-http://127.0.0.1:18480}
      # Requests reach the API through the web container's nginx, one proxy hop.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Sign-in attempts per IP per minute. Raised locally for the QA scripts; production default is 10.
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-600}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-3000}
      API_DOCS: ${API_DOCS:-true}
    ports:
      - "18481:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "18480:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  bsc_postgres_data:
  bsc_redis_data:
